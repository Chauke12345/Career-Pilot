{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Login - Career Pilot AI</title>

    <link rel="stylesheet" href="{% static 'style.css' %}">

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <h1>
            🚀 Career Pilot AI Login
        </h1>


        <form id="loginForm">


            <input 
                id="username"
                type="text"
                placeholder="Username"
                required
            >


            <input 
                id="password"
                type="password"
                placeholder="Password"
                required
            >


            <button type="submit">
                Login
            </button>


            <p>
                No account?
                <a href="{% url 'signup' %}">
                    Create account
                </a>
            </p>


        </form>


        <p id="message"></p>


    </div>


</div>



<script src="{% static 'login.js' %}"></script>


</body>

</html>
